<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منابع یادگیری | امیرعلی سطوتی</title>

    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#8b5cf6',
                    },
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
            min-height: 100vh;
            color: #1e293b;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .post-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .filter-btn {
            transition: all 0.3s;
        }

        .filter-btn.active {
            background-color: #4f46e5;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        .filter-btn:not(.active):hover {
            background-color: #e0e7ff;
            color: #4338ca;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-card {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="text-center text-white mb-12 pt-8">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 drop-shadow-md">
                📚 مرکز منابع یادگیری
            </h1>

            <p class="text-lg opacity-90 mb-8">
                مجموعه جزوات تخصصی آمار، داده‌کاوی و یادگیری ماشین
            </p>

            <div class="max-w-xl mx-auto relative group">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="جستجو در جزوات (مثلاً: SVM، همبستگی...)"
                    class="w-full px-6 py-4 rounded-full text-gray-800 focus:outline-none focus:ring-4 focus:ring-white/30 shadow-lg transition-all"
                    onkeyup="filterPosts()"
                >

                <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors"></i>
            </div>
        </header>

        <div class="flex flex-wrap justify-center gap-3 mb-10" id="filterContainer">
            <button onclick="setCategory('all', this)" class="filter-btn active px-6 py-2 rounded-full font-bold bg-white text-gray-600 shadow-sm">
                همه مطالب
            </button>

            <button onclick="setCategory('ml', this)" class="filter-btn px-6 py-2 rounded-full font-bold bg-white text-gray-600 shadow-sm">
                🤖 یادگیری ماشین
            </button>

            <button onclick="setCategory('multivar', this)" class="filter-btn px-6 py-2 rounded-full font-bold bg-white text-gray-600 shadow-sm">
                📊 آمار چندمتغیره
            </button>

            <button onclick="setCategory('nonparam', this)" class="filter-btn px-6 py-2 rounded-full font-bold bg-white text-gray-600 shadow-sm">
                📉 آمار ناپارامتری
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="postsGrid"></div>

        <div id="noResults" class="hidden text-center text-white py-12">
            <i class="fas fa-search-minus text-6xl mb-4 opacity-50"></i>
            <p class="text-xl">متاسفانه جزوه‌ای با این مشخصات پیدا نشد!</p>
        </div>
    </div>

    <a
        href="/"
        class="fixed bottom-6 left-6 bg-white text-primary p-4 rounded-full shadow-xl hover:scale-110 transition-transform z-50 group"
        aria-label="بازگشت به صفحه اصلی"
        title="صفحه اصلی"
    >
        <i class="fas fa-home text-xl"></i>

        <span class="absolute left-full ml-2 bg-black text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
            صفحه اصلی
        </span>
    </a>

    <script>
        const resources = [
            {
                title: "بخش‌بندی فضای ویژگی و خوشه‌بندی",
                desc: "آموزش Feature Space، Clustering، DBSCAN، تشخیص نقاط پرت و غنی‌سازی ویژگی.",
                tags: ["Clustering", "DBSCAN", "Outlier"],
                category: "ml",
                url: "/posts/feature-space-clustering.html",
                icon: "fa-circle-nodes",
                color: "text-violet-600",
                bg: "bg-violet-100",
                new: true
            },
            {
                title: "جزوه جامع SVM (شب امتحان)",
                desc: "آموزش ماشین بردار پشتیبان، حاشیه سخت/نرم و سوالات امتحانی.",
                tags: ["SVM", "Exam"],
                category: "ml",
                url: "/posts/svm-exam-guide.html",
                icon: "fa-project-diagram",
                color: "text-blue-600",
                bg: "bg-blue-100",
                new: true
            },
            {
                title: "یادگیری بدون نظارت و داده‌کاوی",
                desc: "خوشه‌بندی (K-means, DBSCAN)، کاهش بعد (PCA) و قوانین انجمنی.",
                tags: ["Clustering", "PCA"],
                category: "ml",
                url: "/posts/machine-learning-unsupervised.html",
                icon: "fa-brain",
                color: "text-purple-600",
                bg: "bg-purple-100",
                new: true
            },
            {
                title: "تحلیل همبستگی خطی",
                desc: "آزمون‌های همبستگی پیرسون، تبدیل فیشر و همبستگی درون‌طبقه‌ای.",
                tags: ["Correlation", "Fisher"],
                category: "multivar",
                url: "/posts/correlation-analysis.html",
                icon: "fa-chart-line",
                color: "text-amber-600",
                bg: "bg-amber-100",
                new: true
            },
            {
                title: "آزمون هتلینگ T²",
                desc: "مقایسه بردار میانگین، بازه‌های اطمینان همزمان و بیضی اطمینان.",
                tags: ["Hotelling", "T2"],
                category: "multivar",
                url: "/posts/hotelling-t2.html",
                icon: "fa-superscript",
                color: "text-indigo-600",
                bg: "bg-indigo-100",
                new: true
            },
            {
                title: "آزمون فریدمن (Friedman)",
                desc: "آزمون رتبه‌ای برای مقایسه گروه‌های وابسته (تکراری).",
                tags: ["Friedman", "Rank"],
                category: "nonparam",
                url: "/posts/friedman-test.html",
                icon: "fa-layer-group",
                color: "text-emerald-600",
                bg: "bg-emerald-100",
                new: false
            },
            {
                title: "آزمون کروسکال-والیس",
                desc: "مقایسه چند گروه مستقل (جایگزین ANOVA).",
                tags: ["Kruskal", "H-Test"],
                category: "nonparam",
                url: "/posts/kruskal-wallis-test.html",
                icon: "fa-chart-bar",
                color: "text-teal-600",
                bg: "bg-teal-100",
                new: false
            },
            {
                title: "آزمون من-ویتنی و Runs",
                desc: "مقایسه دو گروه مستقل و بررسی تصادفی بودن داده‌ها.",
                tags: ["Mann-Whitney", "Runs"],
                category: "nonparam",
                url: "/posts/mann-whitney-runs.html",
                icon: "fa-random",
                color: "text-cyan-600",
                bg: "bg-cyan-100",
                new: false
            },
            {
                title: "همبستگی اسپیرمن و کندال",
                desc: "همبستگی‌های رتبه‌ای برای داده‌های غیرنرمال.",
                tags: ["Spearman", "Kendall"],
                category: "nonparam",
                url: "/posts/spearman-kendall-full.html",
                icon: "fa-link",
                color: "text-orange-600",
                bg: "bg-orange-100",
                new: false
            },
            {
                title: "آزمون علامت و ویلکاکسون",
                desc: "آزمون‌های تک‌نمونه‌ای و جفتی برای میانه.",
                tags: ["Sign", "Wilcoxon"],
                category: "nonparam",
                url: "/posts/nonparametric-one-sample-sign-wilcoxon.html",
                icon: "fa-balance-scale",
                color: "text-pink-600",
                bg: "bg-pink-100",
                new: false
            }
        ];

        let currentCategory = "all";

        function init() {
            renderPosts(resources);
        }

        function setCategory(category, button) {
            currentCategory = category;

            document.querySelectorAll(".filter-btn").forEach((item) => {
                item.classList.remove("active");
            });

            button.classList.add("active");
            filterPosts();
        }

        function filterPosts() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();

            const filteredResources = resources.filter((post) => {
                const matchesCategory =
                    currentCategory === "all" || post.category === currentCategory;

                const searchableText = [
                    post.title,
                    post.desc,
                    ...post.tags
                ].join(" ").toLowerCase();

                return matchesCategory && searchableText.includes(query);
            });

            renderPosts(filteredResources);
        }

        function renderPosts(items) {
            const grid = document.getElementById("postsGrid");
            const noResults = document.getElementById("noResults");

            grid.innerHTML = "";

            if (items.length === 0) {
                noResults.classList.remove("hidden");
                return;
            }

            noResults.classList.add("hidden");

            items.forEach((post, index) => {
                const newBadge = post.new
                    ? `
                        <span class="absolute top-3 left-3 bg-red-500 text-white text-xs px-2 py-1 rounded-md font-bold shadow-sm z-10 animate-pulse">
                            جدید
                        </span>
                    `
                    : "";

                const tags = post.tags.map((tag) => {
                    return `
                        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-medium">
                            #${tag}
                        </span>
                    `;
                }).join("");

                const card = `
                    <a
                        href="${post.url}"
                        class="glass-panel rounded-2xl p-6 relative block post-card animate-card group"
                        style="animation-delay: ${index * 0.05}s"
                    >
                        ${newBadge}

                        <div class="flex items-start justify-between mb-4">
                            <div class="w-12 h-12 ${post.bg} ${post.color} rounded-xl flex items-center justify-center text-2xl shadow-sm">
                                <i class="fas ${post.icon}"></i>
                            </div>

                            <div class="flex gap-1 flex-wrap justify-end max-w-[60%]">
                                ${tags}
                            </div>
                        </div>

                        <h3 class="text-xl font-bold text-gray-800 mb-2 leading-tight group-hover:text-primary transition-colors">
                            ${post.title}
                        </h3>

                        <p class="text-gray-600 text-sm leading-relaxed mb-4">
                            ${post.desc}
                        </p>

                        <div class="flex items-center text-primary text-sm font-bold mt-auto">
                            <span>مطالعه جزوه</span>
                            <i class="fas fa-arrow-left mr-2 transition-transform group-hover:-translate-x-1"></i>
                        </div>
                    </a>
                `;

                grid.innerHTML += card;
            });
        }

        init();
    </script>
</body>
</html>
